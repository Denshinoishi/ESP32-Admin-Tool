<head>
  <title>HOME | ESP32 Admin Tool</title>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />

</head>

<body data-theme="light">
  <div id="body" class="theme-green">
    <!-- Overlay For Sidebars -->
    <div class="overlay"></div>
    <div id="wrapper">
      <!-- Page top navbar -->
      <nav class="navbar navbar-fixed-top">
        <div class="container-fluid">
          <div class="navbar-left">
            <div class="navbar-btn">
              <a href="/"><img src="img/esp32.png" alt="Mooli Logo" class="img-fluid logo" /></a>
              <button type="button" class="btn-toggle-offcanvas">
                <i class="fa fa-align-left"></i>
              </button>
            </div>
          </div>
          <div class="navbar-right">
            <div id="navbar-menu">
              <ul class="nav navbar-nav">
                <!-- Claro / Oscuro -->
                <li class="mt-2">
                  <label class="switch dark_mode">
                    <input type="checkbox" />
                    <span class="slider round"></span>
                  </label>
                </li>
                <li class="hidden-xs">
                  <a href="javascript:void(0);" id="btnFullscreen" class="icon-menu"><i
                      class="fa fa-arrows-alt"></i></a>
                </li>
                <li>
                  <a href="esp-logout" class="icon-menu"><i class="fa fa-power-off"></i></a>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </nav>
      <!-- Main left sidebar menu -->
      <div id="left-sidebar" class="sidebar">
        <a href="#" class="menu_toggle"><i class="fa fa-angle-left"></i></a>
        <!-- Logo -->
        <div class="navbar-brand">
          <a href="/"><img src="img/esp32.png" alt="ESP32 Admin Tool Logo"
              class="img-fluid logo" /><span>#platform#</span></a>
          <button type="button" class="btn-toggle-offcanvas btn btn-sm float-right">
            <i class="lnr lnr-menu fa fa-chevron-circle-left"></i>
          </button>
        </div>
        <!-- sidebar -->
        <div class="sidebar-scroll">
          <!-- user -->
          <div class="user-account">
            <div class="user_div">
              <img src="img/user.png" class="user-photo" alt="User Profile Picture" />
            </div>
            <div class="dropdown">
              <span>Administrador,</span>
              <a href="javascript:void(0);" class="dropdown-toggle user-name"
                data-toggle="dropdown"><strong>Usuario</strong></a>
              <ul class="dropdown-menu dropdown-menu-right account vivify flipInY">
                <li>
                  <a href="esp-admin"><i class="fa fa-user"></i>Perfil</a>
                </li>
                <li class="divider"></li>
                <li>
                  <a href="esp-logout"><i class="fa fa-power-off"></i>Salir</a>
                </li>
              </ul>
            </div>
          </div>
          <!-- user end -->
          <!-- menu -->
          <nav id="left-sidebar-nav" class="sidebar-nav">
            <ul id="main-menu" class="metismenu animation-li-delay">
              <li class="header">Inicio</li>
              <li><a href="/"><i class="fa fa-dashboard"></i> <span>Dashboard</span></a></li>
              <li class="active"><a href="esp-print"><i class="fa fa-print"></i> <span>Printer</span></a></li>
              <li class="header">Conectividad</li>
              <li>
                <a href="esp-wifi"><i class="fa fa-wifi"></i> <span>WiFi</span></a>
              </li>
              <li>
                <a href="esp-mqtt"><i class="fa fa-tasks"></i> <span>MQTT</span></a>
              </li>
              <li class="header">Configuraciones</li>
              <li>
                <a href="#uiElements" class="has-arrow"><i class="fa fa-cog"></i><span>Administrar</span></a>
                <ul>
                  <li><a href="esp-device">Dispositivo</a></li>
                  <li><a href="esp-admin">Contraseña</a></li>
                  <li><a href="esp-restore">Restablecer</a></li>
                  <li><a href="esp-restart">Reiniciar</a></li>
                </ul>
              </li>
              <li class="header">sesión</li>
              <li>
                <a href="esp-logout"><i class="fa fa-power-off"></i> <span>Salir</span></a>
              </li>
            </ul>
          </nav>
          <!-- menu end -->
        </div>
      </div>
      <!-- Main body part  -->
      <div id="main-content">
        <div class="container mt-4">
          <h3 class="mb-3" id="page">Consola RS232</h3>
          <!-- Formulario para enviar comandos -->
          <form form method="post" name="esp-command" action="esp-command" method="POST" id="form">

            <label for="commandInput" class="text-secondary">Comando Hexadecimal</label><br />
            <label for="commandInput" class="formulario_input-error" id="form_commandInput">Formato Incorrecto.</label>
            <div class="input-group mb-3">
              <input type="text" class="form-control command" id="commandInput" name="commandInput"
                placeholder="Escribe comando Hex" aria-describedby="basic-addon1" data-expresion="HexCommand" />
            </div>
            <label for="commandInput" class="text-secondary">Checksum:</label><br>
            <label id="form_commandChecksum" class="formulario_input-checksum">
              (se calculará automáticamente)
            </label>
            <button type="submit" class="btn btn-primary">Enviar</button>
          </form>
          <!-- Área de respuestas en crudo -->
          <div class="card">
            <div class="card-header">Respuesta</div>
            <div class="card-body">
              <pre id="responseLog" style="
                    height: 200px;
                    overflow-y: auto;
                    background: #dee4ea;
                    padding: 10px;
                  "></pre>
            </div>
          </div>
          <div>
              <button id="clearLog" class="btn-info">Limpiar</button>
          </div>
        </div>
      </div>
      <!-- Main body end  -->
      <form id="form"></form>
    </div>
  </div>
  <!-- Javascript -->
  <script src="js/libscripts.js"></script>
  <script src="js/vendorscripts.js"></script>
  <!-- Vedor js file and create bundle with grunt  -->
  <script src="js/sweetalert.js"></script>
  <!-- Project core js file minify with grunt -->
  <script src="js/mainscripts.js "></script>
  <!-- Custom Scripts -->
  <script src="js/scripts.js "></script>
</body>

</html>
